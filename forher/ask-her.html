<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Question for You ❤️</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Floating Hearts Animation */
      @keyframes floatUp {
        0% {
          transform: translateY(110vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) translateX(20px);
          opacity: 0;
        }
      }
      .heart-float {
        animation: floatUp linear infinite;
      }

      /* Smooth Transitions */
      .smooth-move {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Date/Time Input Styles */
      input[type="date"],
      input[type="time"] {
        accent-color: #ec4899; /* pink-500 */
      }
    </style>
  </head>
  <body class="bg-pink-50 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- ICONS (SVG Components) ---
      const IconHeart = ({ size = 24, className = "" }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        </svg>
      );
      const IconMusic = ({ size = 24, className = "" }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
      );
      const IconVolume2 = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      );
      const IconVolumeX = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="23" x2="17" y1="9" y2="15" />
          <line x1="17" x2="23" y1="9" y2="15" />
        </svg>
      );
      const IconCoffee = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
          <line x1="6" x2="6" y1="2" y2="4" />
          <line x1="10" x2="10" y1="2" y2="4" />
          <line x1="14" x2="14" y1="2" y2="4" />
        </svg>
      );
      const IconMountain = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
        </svg>
      );
      const IconHome = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      );
      const IconUtensils = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
          <path d="M7 2v20" />
          <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
        </svg>
      );
      const IconPalette = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
          <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
          <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
          <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.093 0-.679.52-1.219 1.218-1.219 1.453 0 3.016-1.272 3.016-3.296V11.5c0-5.25-4.25-9.5-9.5-9.5z" />
        </svg>
      );
      const IconArrowRight = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      );
      const IconCalendar = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
          <line x1="16" x2="16" y1="2" y2="6" />
          <line x1="8" x2="8" y1="2" y2="6" />
          <line x1="3" x2="21" y1="10" y2="10" />
        </svg>
      );
      const IconClock = ({ size = 24 }) => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      );

      // --- DATA ---
      const DATE_OPTIONS = {
        Cafe: {
          icon: <IconCoffee size={24} />,
          options: [
            {
              name: "Kape Sinukuan",
              image:
                "https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=400&h=300&fit=crop",
            },
            {
              name: "1798 Lifestyle Studio",
              image:
                "https://images.unsplash.com/photo-1521017432531-fbd92d768814?w=400&h=300&fit=crop",
            },
            {
              name: "Café T.Y.S.",
              image:
                "https://images.unsplash.com/photo-1463797221720-6b07e6426c24?w=400&h=300&fit=crop",
            },
            {
              name: "Kaffe Uno",
              image:
                "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&h=300&fit=crop",
            },
            {
              name: "Café Alaya",
              image:
                "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=400&h=300&fit=crop",
            },
            {
              name: "Kanto't Coffe",
              image:
                "https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?w=400&h=300&fit=crop",
            },
          ],
        },
        Hiking: {
          icon: <IconMountain size={24} />,
          options: [
            { name: "TKO Viewpoint (Arayat)" },
            { name: "Arayat National Park Circuit Trail" },
            { name: "White Rock (Magalang)" },
            { name: "Mt. Arayat Ridge Trail" },
          ],
        },
        Home: {
          icon: <IconHome size={24} />,
          options: [{ name: "Yours" }, { name: "Mine" }],
        },
        Food: {
          icon: <IconUtensils size={24} />,
          options: [
            { name: "Home Cooked" },
            { name: "Fast Food" },
            { name: "Resto" },
            { name: "Custom" },
          ],
        },
        Activity: {
          icon: <IconPalette size={24} />,
          options: [
            { name: "Painting" },
            { name: "Movie Marathon" },
            { name: "Cook Together" },
            { name: "Lego" },
          ],
        },
      };

      // --- COMPONENT: Background Hearts ---
      const FloatingHearts = () => {
        // Create fixed set of hearts
        const hearts = Array.from({ length: 15 }).map((_, i) => ({
          id: i,
          left: Math.random() * 100,
          delay: Math.random() * 5,
          duration: 5 + Math.random() * 10,
          size: 10 + Math.random() * 20,
        }));

        return (
          <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
            {hearts.map((heart) => (
              <div
                key={heart.id}
                className="absolute text-pink-200 heart-float"
                style={{
                  left: `${heart.left}vw`,
                  animationDelay: `${heart.delay}s`,
                  animationDuration: `${heart.duration}s`,
                  top: "100vh", // Start below screen
                }}
              >
                <IconHeart size={heart.size} className="fill-current" />
              </div>
            ))}
          </div>
        );
      };

      // --- COMPONENT: Music Player ---
      const MusicPlayer = () => {
        const [playing, setPlaying] = useState(false);
        const audioRef = useRef(null);

        const togglePlay = () => {
          if (playing) {
            audioRef.current.pause();
          } else {
            audioRef.current
              .play()
              .catch((e) => console.log("Audio play failed:", e));
          }
          setPlaying(!playing);
        };

        return (
          <div className="fixed top-4 right-4 z-50">
            <audio ref={audioRef} loop>
              <source
                src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                type="audio/mp3"
              />
            </audio>
            <button
              onClick={togglePlay}
              className="bg-white/80 backdrop-blur-sm p-3 rounded-full shadow-lg hover:bg-pink-100 transition-colors text-pink-600"
            >
              {playing ? <IconVolume2 size={24} /> : <IconVolumeX size={24} />}
            </button>
          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [step, setStep] = useState(0);
        const [noBtnPosition, setNoBtnPosition] = useState({ x: 0, y: 0 });
        const [hoverCount, setHoverCount] = useState(0);
        const [isMobile, setIsMobile] = useState(false);

        // Date Planning State
        const [selectedCategory, setSelectedCategory] = useState(null);
        const [selectedOption, setSelectedOption] = useState(null);
        const [customFoodPlace, setCustomFoodPlace] = useState("");
        const [date, setDate] = useState("");
        const [time, setTime] = useState("");

        useEffect(() => {
          setIsMobile(window.innerWidth < 768);
          window.addEventListener("resize", () =>
            setIsMobile(window.innerWidth < 768)
          );
        }, []);

        const noPhrases = [
          "No",
          "Are you sure?",
          "Really sure?",
          "Think again!",
          "Last chance!",
          "Surely not?",
          "You might regret this!",
          "Give it another thought!",
          "Are you absolutely certain?",
          "This could be a mistake!",
          "Have a heart!",
          "Don't be so cold!",
          "Change of heart?",
          "Wouldn't you reconsider?",
          "Is that your final answer?",
          "You're breaking my heart ;(",
        ];

        const getNoButtonText = () =>
          noPhrases[Math.min(hoverCount, noPhrases.length - 1)];

        const moveNoButton = (e) => {
          const safePadding = 20;
          const estimatedButtonWidth = 300;
          const estimatedButtonHeight = 100;

          const maxX = Math.max(
            safePadding,
            window.innerWidth - estimatedButtonWidth
          );
          const maxY = Math.max(
            safePadding,
            window.innerHeight - estimatedButtonHeight
          );

          const newX = Math.random() * maxX;
          const newY = Math.random() * maxY;

          setNoBtnPosition({ x: newX, y: newY });
          setHoverCount((prev) => prev + 1);
        };

        const handleDateConfirm = () => {
          if (!selectedOption || !date || !time) return;
          if (
            selectedCategory === "Food" &&
            selectedOption.name === "Custom" &&
            !customFoodPlace
          )
            return;
          setStep(2);
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-100 to-red-100 flex items-center justify-center relative font-sans p-4">
            <FloatingHearts />
            <MusicPlayer />

            {/* STEP 0: QUESTION */}
            {step === 0 && (
              <div className="bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-lg w-full mx-4 z-10 border-4 border-pink-200 relative transition-all duration-500 ease-in-out transform">
                <div className="mb-6 flex justify-center">
                  <div className="relative">
                    <div className="text-pink-500 animate-bounce">
                      <IconHeart size={64} className="fill-current" />
                    </div>
                  </div>
                </div>

                <h1 className="text-3xl md:text-4xl font-bold text-gray-800 mb-8 leading-tight">
                  Will you go out with me?
                </h1>

                <div className="flex flex-col md:flex-row gap-4 justify-center items-center h-32 relative">
                  <button
                    onClick={() => setStep(1)}
                    className="px-8 py-3 bg-green-500 text-white text-xl font-bold rounded-full shadow-lg hover:bg-green-600 transition-transform duration-200 transform hover:scale-110 w-full md:w-auto"
                    style={{ transform: `scale(${1 + hoverCount * 0.05})` }}
                  >
                    Yes
                  </button>

                  <button
                    onMouseEnter={moveNoButton}
                    onClick={moveNoButton} // For mobile touch
                    style={
                      hoverCount === 0
                        ? {}
                        : {
                            position: "fixed",
                            left: noBtnPosition.x,
                            top: noBtnPosition.y,
                            transition: "all 0.3s ease",
                            zIndex: 50,
                          }
                    }
                    className="px-8 py-3 bg-red-500 text-white text-xl font-bold rounded-full shadow-lg hover:bg-red-600 transition-colors w-full md:w-auto smooth-move"
                  >
                    {getNoButtonText()}
                  </button>
                </div>
              </div>
            )}

            {/* STEP 1: PLANNER */}
            {step === 1 && (
              <div className="bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-4xl z-10 border-4 border-pink-200 h-[85vh] flex flex-col transition-all duration-500 animate-fade-in-up">
                <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-2 text-center">
                  Yay! What's the plan? ❤️
                </h2>
                <p className="text-center text-gray-500 mb-6">
                  Select a vibe for our date
                </p>

                {/* Category Tabs */}
                <div className="flex flex-wrap gap-2 justify-center mb-6">
                  {Object.entries(DATE_OPTIONS).map(([key, data]) => (
                    <button
                      key={key}
                      onClick={() => {
                        setSelectedCategory(key);
                        setSelectedOption(null);
                      }}
                      className={`flex items-center gap-2 px-4 py-2 rounded-full transition-all duration-300 ${
                        selectedCategory === key
                          ? "bg-pink-500 text-white shadow-lg transform scale-105"
                          : "bg-white border border-pink-200 text-pink-500 hover:bg-pink-50"
                      }`}
                    >
                      {data.icon}
                      <span className="font-semibold">{key}</span>
                    </button>
                  ))}
                </div>

                {/* Options Area */}
                <div className="flex-1 overflow-y-auto pr-2 no-scrollbar">
                  {selectedCategory ? (
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                      {DATE_OPTIONS[selectedCategory].options.map(
                        (option, idx) => (
                          <div
                            key={idx}
                            onClick={() => setSelectedOption(option)}
                            className={`relative cursor-pointer rounded-xl overflow-hidden border-2 transition-all duration-300 group ${
                              selectedOption?.name === option.name
                                ? "border-pink-500 ring-2 ring-pink-200 shadow-xl"
                                : "border-transparent hover:border-pink-300 shadow-md bg-white"
                            }`}
                          >
                            {/* Special Layout for Cafes with Images */}
                            {selectedCategory === "Cafe" ? (
                              <div className="aspect-[4/3] relative">
                                <img
                                  src={option.image}
                                  alt={option.name}
                                  className="w-full h-full object-cover"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex items-end p-3">
                                  <span className="text-white font-bold shadow-black drop-shadow-md leading-tight">
                                    {option.name}
                                  </span>
                                </div>
                                {selectedOption?.name === option.name && (
                                  <div className="absolute top-2 right-2 bg-pink-500 text-white p-1 rounded-full animate-bounce">
                                    <IconHeart
                                      size={16}
                                      className="fill-current"
                                    />
                                  </div>
                                )}
                              </div>
                            ) : (
                              // Standard Layout
                              <div className="p-4 flex flex-col items-center justify-center h-full min-h-[100px] text-center">
                                <span className="font-bold text-gray-700 group-hover:text-pink-600 transition-colors">
                                  {option.name}
                                </span>
                              </div>
                            )}
                          </div>
                        )
                      )}
                    </div>
                  ) : (
                    <div className="h-full flex items-center justify-center text-gray-400 italic">
                      Select a category above to see options!
                    </div>
                  )}
                </div>

                {/* Custom Input for Food */}
                {selectedCategory === "Food" &&
                  selectedOption?.name === "Custom" && (
                    <div className="mt-4 animate-fade-in">
                      <input
                        type="text"
                        placeholder="Type the restaurant name..."
                        value={customFoodPlace}
                        onChange={(e) => setCustomFoodPlace(e.target.value)}
                        className="w-full p-3 rounded-lg border-2 border-pink-200 focus:border-pink-500 outline-none transition-colors"
                      />
                    </div>
                  )}

                {/* DATE & TIME PICKER SECTION (NEW) */}
                <div className="mt-6 border-t pt-4 border-gray-100">
                  <h3 className="text-lg font-bold text-gray-700 mb-3 text-center">
                    When are we going?
                  </h3>
                  <div className="flex flex-col md:flex-row gap-4 justify-center">
                    <div className="flex-1">
                      <label className="block text-sm text-gray-500 mb-1 ml-1">
                        Date
                      </label>
                      <div className="relative">
                        <input
                          type="date"
                          value={date}
                          onChange={(e) => setDate(e.target.value)}
                          className="w-full p-3 pl-10 rounded-xl border-2 border-pink-100 focus:border-pink-500 outline-none bg-gray-50/50"
                        />
                        <div className="absolute left-3 top-3.5 text-pink-400 pointer-events-none">
                          <IconCalendar size={20} />
                        </div>
                      </div>
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm text-gray-500 mb-1 ml-1">
                        Time
                      </label>
                      <div className="relative">
                        <input
                          type="time"
                          value={time}
                          onChange={(e) => setTime(e.target.value)}
                          className="w-full p-3 pl-10 rounded-xl border-2 border-pink-100 focus:border-pink-500 outline-none bg-gray-50/50"
                        />
                        <div className="absolute left-3 top-3.5 text-pink-400 pointer-events-none">
                          <IconClock size={20} />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Confirm Button */}
                <div className="mt-6 flex justify-end">
                  <button
                    onClick={handleDateConfirm}
                    disabled={
                      !selectedOption ||
                      !date ||
                      !time ||
                      (selectedCategory === "Food" &&
                        selectedOption.name === "Custom" &&
                        !customFoodPlace)
                    }
                    className={`flex items-center gap-2 px-8 py-3 rounded-full font-bold text-lg transition-all duration-300 ${
                      !selectedOption ||
                      !date ||
                      !time ||
                      (selectedCategory === "Food" &&
                        selectedOption.name === "Custom" &&
                        !customFoodPlace)
                        ? "bg-gray-300 text-gray-500 cursor-not-allowed"
                        : "bg-green-500 text-white hover:bg-green-600 shadow-lg hover:shadow-xl transform hover:-translate-y-1"
                    }`}
                  >
                    Let's Go! <IconArrowRight size={20} />
                  </button>
                </div>
              </div>
            )}

            {/* STEP 2: SUCCESS */}
            {step === 2 && (
              <div className="bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-lg mx-4 z-10 border-4 border-pink-200 animate-fade-in-up">
                <div className="mb-6 flex justify-center">
                  <div className="flex gap-2">
                    <div className="text-red-500 animate-pulse">
                      <IconHeart size={48} className="fill-current" />
                    </div>
                    <div className="text-pink-500 animate-bounce delay-75">
                      <IconHeart size={64} className="fill-current" />
                    </div>
                    <div className="text-red-500 animate-pulse delay-150">
                      <IconHeart size={48} className="fill-current" />
                    </div>
                  </div>
                </div>

                <h1 className="text-3xl md:text-5xl font-bold text-gray-800 mb-4">
                  It's a Date! 🎉
                </h1>
                <p className="text-xl text-gray-600 mb-8">
                  We are going to{" "}
                  <span className="text-pink-600 font-bold">
                    {selectedCategory === "Food" &&
                    selectedOption?.name === "Custom"
                      ? customFoodPlace
                      : selectedOption?.name}
                  </span>{" "}
                  on{" "}
                  <span className="text-pink-600 font-bold whitespace-nowrap">
                    {date}
                  </span>{" "}
                  at{" "}
                  <span className="text-pink-600 font-bold whitespace-nowrap">
                    {time}
                  </span>
                  !
                  <br />
                  See you soon! ❤️
                </p>

                <button
                  onClick={() => window.print()}
                  className="text-sm text-gray-400 hover:text-pink-500 underline"
                >
                  (Screenshot this or print it as a receipt!)
                </button>
              </div>
            )}

            <div className="fixed bottom-2 w-full text-center text-pink-300 text-sm pointer-events-none z-0">
              Made with ❤️
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
